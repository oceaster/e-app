<!doctype html>
<html lang="en" class="web-mode">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- THE e-app OWNS THIS DOCUMENT. Owen, 2026-11-09: "simply remove the top nav bar from e-server,
     and make sure all it's code and functionality is moved to e-app." It is a file in app.asar, not
     an e-server route: the bar and the one frame are ours, the pages are the server's.
     CSP: `frame-src https:` is the one allowance a chrome that frames an instance needs; the code
     below only ever points the frame at the configured instance origin plus a registry href. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https: http://127.0.0.1:* http://localhost:*; connect-src 'none'">
<title>e-server</title>

<link rel="stylesheet" href="vendor/launcher/theme/launcher-bindings.css">

<script src="chrome-boot.js" defer></script>
<script src="chrome-host.js" defer></script>
</head>

  </div>
 </nav>
</header>
<main class="sf-content" id="shell-content" tabindex="-1" aria-label="Page content" aria-busy="true">
 <section class="sf-status" id="shell-status" aria-labelledby="shell-status-heading">
  <div class="sf-status-inner">
   <h1 id="shell-status-heading" tabindex="-1">Opening</h1>
   <p id="shell-status-detail">Waiting for the page.</p>
   <button type="button" data-action="retry-content" hidden>Try again</button>
  </div>
 </section>
 <iframe id="shell-frame" name="shell-frame" title="Page content" src="about:blank" loading="eager" referrerpolicy="same-origin" hidden></iframe>
</main>
<p id="shell-announce" class="sf-announce" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
